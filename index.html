<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日记</title>
<!--
  本地离线日记工具（无外部依赖，零网络请求）

  结构：
    index.html      页面结构
    css/style.css   样式
    js/app.js       全部逻辑与数据结构说明

  数据存储：浏览器 localStorage，键名 diary.records.v1，仅存于本机。
  备份方式：页面内「导出 JSON」生成备份文件；「导入 JSON」从备份恢复（导入将替换当前数据）。
-->
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<main>
  <h1>日记</h1>

  <form id="entry-form" novalidate>
    <div class="form-row">
      <label>日期
        <input type="date" id="f-date" class="inp">
      </label>
    </div>
    <label>事件
      <input type="text" id="f-event" class="inp" placeholder="发生了什么" autocomplete="off">
    </label>
    <label>状态 / 反应（选填）
      <textarea id="f-reaction" class="inp" rows="2" placeholder="如情绪、身体感受等，可留空"></textarea>
    </label>
    <button type="submit" class="btn primary">保存</button>
  </form>

  <div class="toolbar">
    <h2>历史</h2>
    <span class="group">
      <button type="button" class="btn" id="btn-export">导出 JSON</button>
      <button type="button" class="btn" id="btn-import">导入 JSON</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
    </span>
  </div>

  <ul class="list" id="list"></ul>
</main>

<footer>
  数据存储：本机浏览器 localStorage（键名 diary.records.v1），不经过任何网络。<br>
  备份：「导出 JSON」保存备份文件；换设备或浏览器时用「导入 JSON」选择备份文件恢复（导入将替换当前数据）。
</footer>

<div id="toast"></div>

<script src="./js/app.js"></script>
</body>
</html>

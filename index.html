<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日记</title>
<!--
  本地离线日记工具（无外部依赖，零网络请求）

  结构：
    index.html      页面结构
    css/style.css   样式
    js/app.js       全部逻辑与数据结构说明

  数据存储：浏览器 localStorage，键名 diary.records.v1，仅存于本机。
  备份方式：页面内「导出 JSON」生成备份文件；「导入 JSON」从备份恢复（导入将替换当前数据）。
-->
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<main>
  <header class="app-head">
    <h1 id="app-title">日记</h1>
    <button type="button" class="btn title-edit" id="btn-title-edit" title="修改日记名称">✎</button>
  </header>

  <form id="entry-form" novalidate>
    <div class="form-row">
      <label>日期
        <span class="date-line">
          <input type="date" id="f-date" class="inp">
          <span class="day-badge" id="form-daynum"></span>
        </span>
      </label>
    </div>
    <div class="rows-label">事件（同一天可记录多条，每条可独立选择情绪/身体）</div>
    <div id="form-rows"></div>
    <div class="form-btns">
      <button type="button" class="btn add-row" id="btn-add-row">＋ 添加事件</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>

  <div class="toolbar">
    <h2>历史</h2>
    <span class="group">
      <button type="button" class="btn" id="btn-export">导出 JSON</button>
      <button type="button" class="btn" id="btn-import">导入 JSON</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
    </span>
  </div>

  <ul class="list" id="list"></ul>
</main>

<footer>
  备份：「导出 JSON」保存备份文件；换设备或浏览器时用「导入 JSON」选择备份文件恢复（导入将替换当前数据）。<br>
  <a href="https://github.com/Poro789/100diary" target="_blank" rel="noopener">100diary · GitHub</a> · MIT 许可 · 纯本地应用，数据仅存于本机
</footer>

<div id="toast"></div>

<!-- 情绪/身体选择：底部上滑面板（移动端）/ 居中弹层（桌面端） -->
<div id="sheet-backdrop" class="backdrop" hidden></div>
<div id="sheet" class="sheet" hidden>
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h3 id="sheet-title"></h3>
    <button type="button" class="btn" id="btn-sheet-close">关闭</button>
  </div>
  <p class="sheet-hint">点选项即可选中或取消，可反复修改；完成后点「关闭」</p>
  <div id="sheet-options" class="chips"></div>
</div>

<!-- 日记图片预览 -->
<div id="img-backdrop" class="img-backdrop" hidden>
  <div class="img-card">
    <img id="img-preview" alt="日记图片">
    <p id="img-hint" class="img-hint"></p>
    <div class="img-actions">
      <button type="button" class="btn primary" id="btn-img-download">下载图片</button>
      <button type="button" class="btn" id="btn-img-close">关闭</button>
    </div>
  </div>
</div>

<!-- 改日期：专用日期弹框（原生 date 控件） -->
<div id="date-backdrop" class="backdrop" hidden></div>
<div id="date-dialog" class="date-dialog" hidden>
  <h3>修改日期</h3>
  <input type="date" id="date-dialog-input" class="inp">
  <div class="date-dialog-actions">
    <button type="button" class="btn" id="btn-date-cancel">取消</button>
    <button type="button" class="btn primary" id="btn-date-ok">确定</button>
  </div>
</div>

<script src="./js/app.js"></script>
</body>
</html>
